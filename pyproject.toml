[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senegal-rental-price"
version = "0.1.0"
description = "Prédiction du prix de location immobilière au Sénégal — chaîne MLOps de bout en bout."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "M2 DSIA" }]
keywords = ["mlops", "real-estate", "senegal", "fastapi", "mlflow"]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.11",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.3",
    "black>=24.0",
    "pre-commit>=3.6",
    "pandas-stubs>=2.1",
    "types-requests",
]
frontend = [
    "streamlit>=1.33",
    "requests>=2.31",
]

[project.scripts]
senegal-rental-train = "senegal_rental_price.models.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
senegal_rental_price = ["py.typed"]

# ----------------------------- Tooling -----------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "tests"]
# Notebooks = exploration, hors regles d'ingenierie logicielle (cf. sujet SS3).
extend-exclude = ["notebooks"]

[tool.ruff.lint.isort]
known-first-party = ["senegal_rental_price", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N803", "N806", "UP042"]  # ML-style var names ; (str, Enum) impose par le sujet

[tool.mypy]
strict = true
files = ["src", "api"]
plugins = ["pydantic.mypy"]
# scikit-learn / xgboost ship without complete stubs -> ignore only those imports
[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "mlflow.*", "joblib.*", "hydra.*", "omegaconf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore::DeprecationWarning:numpy.*",
    "default",
]

[tool.coverage.run]
source = ["senegal_rental_price"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError"]
